<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>CV-generator</title>
		<meta name="description" content="Genera un CV profesional y moderno en minutos. Elige estilo, personaliza y descarga en PDF.">
		<meta property="og:type" content="website">
		<meta name="robots" content="index, follow">
		<meta name="author" content="CV-generator">
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- theme-color is set from CMS/layout in +layout.svelte -->
		<!-- Extra SEO can be injected via <svelte:head> per route -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
